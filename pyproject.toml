[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-energy-lab"
version = "0.1.0"
description = "Unified research library foundation for Open Energy Lab."
readme = "README.md"
requires-python = ">=3.11"
# Required workflow backends remain lazily imported by their package adapters.
dependencies = [
    "highspy==1.15.1",
    "pandas",
    "pyarrow==25.0.0",
    "pvlib",
    "pyomo==6.10.1",
    "spflow==1.1.0",
    "timezonefinder",
]

[dependency-groups]
dev = [
    "ipykernel",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_energy_lab"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = [".", "src"]
addopts = "-ra"
