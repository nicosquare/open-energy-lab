[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-energy-lab"
version = "0.1.0"
description = "Unified research library foundation for Open Energy Lab."
readme = "README.md"
requires-python = ">=3.11"
# Required workflow backends remain lazily imported by their package adapters.
dependencies = [
    "highspy==1.15.1",
    "pandas",
    "pyarrow==25.0.0",
    "pvlib",
    "pyomo==6.10.1",
    "spflow==1.1.0",
    "timezonefinder",
]

[project.optional-dependencies]
gurobi = [
    "gurobipy==13.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6",
]
notebook = [
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "nbclient",
    "seaborn",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_energy_lab"]
exclude = [
    "/artifacts/**",
    "/baselines/**",
    "/tests/fixtures/restoration/france_2026-08-20_afrr_market_v1.json",
    "/tests/fixtures/restoration/france_2026-08-20_afrr_scenario_v1.json",
    "/tests/fixtures/restoration/france_2026-08-15_mfrr_market_v1.json",
    "/tests/fixtures/restoration/france_2026-08-15_mfrr_scenario_v1.json",
    "/tests/fixtures/restoration/france_restoration_expected_results_v1.json",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/artifacts/**",
    "/baselines/**",
    "/tests/fixtures/market/france_2022-08-19_market_v1.json",
    "/tests/fixtures/market/france_2022-08-19_activation_v1.json",
    "/tests/fixtures/market/france_2022-08-19_expected_replay_v1.json",
    "/tests/fixtures/restoration/france_2026-08-20_afrr_market_v1.json",
    "/tests/fixtures/restoration/france_2026-08-20_afrr_scenario_v1.json",
    "/tests/fixtures/restoration/france_2026-08-15_mfrr_market_v1.json",
    "/tests/fixtures/restoration/france_2026-08-15_mfrr_scenario_v1.json",
    "/tests/fixtures/restoration/france_restoration_expected_results_v1.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
# A plain `pytest` runs the routine offline suite. Opt-in groups are selected
# explicitly, e.g. `pytest -m slow` or `pytest -m "reference_benchmark or
# external_reference_data"`; a later -m on the command line replaces this one.
addopts = """-ra --strict-markers -m "not slow and not notebook and not licensed_gurobi \
and not live_entsoe and not live_rte and not reference_benchmark \
and not external_reference_data""""
markers = [
    "slow: solver-backed or multi-day checks taking more than about ten seconds (run in their own CI job)",
    "notebook: executes a walkthrough notebook; needs the notebook dependency group (run in their own CI job)",
    "licensed_gurobi: explicitly selected checks requiring an installed and licensed Gurobi",
    "live_entsoe: explicitly selected credentialed ENTSO-E compatibility checks (excluded from routine offline validation)",
    "live_rte: explicitly selected credentialed RTE compatibility checks (excluded from routine offline validation)",
    "reference_benchmark: explicitly selected reference-host performance checks (excluded from routine correctness validation)",
    "external_reference_data: explicitly selected checks requiring caller-installed reference data (excluded from routine offline validation)",
]
