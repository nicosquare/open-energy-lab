[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-energy-lab"
version = "0.1.0"
description = "Unified research library foundation for Open Energy Lab."
readme = "README.md"
requires-python = ">=3.11"
# Required workflow backends remain lazily imported by their package adapters.
dependencies = [
    "highspy==1.15.1",
    "pandas",
    "pyarrow==25.0.0",
    "pvlib",
    "pyomo==6.10.1",
    "spflow==1.1.0",
    "timezonefinder",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
notebook = [
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "nbclient",
    "seaborn",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_energy_lab"]
exclude = [
    "/tests/fixtures/restoration/france_2026-08-20_afrr_market_v1.json",
    "/tests/fixtures/restoration/france_2026-08-20_afrr_scenario_v1.json",
    "/tests/fixtures/restoration/france_2026-08-15_mfrr_market_v1.json",
    "/tests/fixtures/restoration/france_2026-08-15_mfrr_scenario_v1.json",
    "/tests/fixtures/restoration/france_restoration_expected_results_v1.json",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/tests/fixtures/market/france_2022-08-19_market_v1.json",
    "/tests/fixtures/market/france_2022-08-19_activation_v1.json",
    "/tests/fixtures/market/france_2022-08-19_expected_replay_v1.json",
    "/tests/fixtures/restoration/france_2026-08-20_afrr_market_v1.json",
    "/tests/fixtures/restoration/france_2026-08-20_afrr_scenario_v1.json",
    "/tests/fixtures/restoration/france_2026-08-15_mfrr_market_v1.json",
    "/tests/fixtures/restoration/france_2026-08-15_mfrr_scenario_v1.json",
    "/tests/fixtures/restoration/france_restoration_expected_results_v1.json",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = [".", "src"]
addopts = "-ra"
markers = [
    "live_entsoe: explicitly selected credentialed ENTSO-E compatibility checks (excluded from routine offline validation)",
    "live_rte: explicitly selected credentialed RTE compatibility checks (excluded from routine offline validation)",
    "reference_benchmark: explicitly selected reference-host performance checks (excluded from routine correctness validation)",
    "external_reference_data: explicitly selected checks requiring caller-installed reference data (excluded from routine offline validation)",
]
