[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-energy-lab"
version = "0.1.0"
description = "Unified research library foundation for Open Energy Lab."
readme = "README.md"
requires-python = ">=3.11"
# Keep the ordinary runtime surface small, but ship the promoted stochastic
# weather fit/fetch stack in the base environment.
dependencies = [
    "pandas",
    "pvlib",
    "timezonefinder",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_energy_lab"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "-ra"
