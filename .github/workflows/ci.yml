name: CI

# Private repo: Actions minutes are billed. Run once per PR update (not also
# on the branch push), check merges to main, and skip docs-only changes.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'notes/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', 'notes/**', '**/*.md']

permissions:
  contents: read

# Test selection lives in pyproject.toml markers, not in this file:
# - a plain `pytest` runs the routine offline suite;
# - `slow` and `notebook` tests run in their own jobs below;
# - licensed_gurobi, live_entsoe/live_rte, reference_benchmark and
#   external_reference_data need a licence, credentials, or private reference
#   data, and are run locally on demand only.
env:
  OPT_IN: >-
    not licensed_gurobi and not live_entsoe and not live_rte
    and not reference_benchmark and not external_reference_data

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: py${{ matrix.python-version }}
      - name: Install locked project environment
        run: uv sync --locked --group dev
      - name: Verify required backends
        run: uv run --locked --no-sync python tools/verify_backends.py
      - name: Run routine suite
        run: uv run --locked --no-sync pytest

  slow:
    name: Slow solver and replay tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: slow-py3.14
      - name: Install locked project environment
        run: uv sync --locked --group dev
      - name: Verify required backends
        run: uv run --locked --no-sync python tools/verify_backends.py
      - name: Run slow tests
        run: uv run --locked --no-sync pytest -m "slow and ${OPT_IN}"

  notebooks:
    name: Notebooks (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: notebooks-py3.12
      - name: Install locked notebook environment
        run: uv sync --locked --group dev --group notebook
      - name: Verify required and notebook backends
        run: uv run --locked --no-sync python tools/verify_backends.py --notebook
      - name: Execute notebooks offline
        run: uv run --offline --locked --no-sync pytest -m "notebook and ${OPT_IN}"

  sp-tpm:
    name: sp-tpm standalone (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: packages/sp-tpm/pyproject.toml
          cache-suffix: sp-tpm-py3.11
      # The workspace lock targets Python >=3.12, so sp-tpm is installed on its
      # own here, and pythonpath drops src/ so open_energy_lab is not importable.
      - name: Install sp-tpm without open_energy_lab
        run: |
          uv venv -p 3.11 .venv-sp-tpm
          uv pip install -p .venv-sp-tpm -e "packages/sp-tpm[highs]" pytest pyyaml
      - name: Verify required backends
        run: .venv-sp-tpm/bin/python tools/verify_backends.py
      - name: Run tpm tests
        run: .venv-sp-tpm/bin/python -m pytest -o pythonpath=. tests/unit/tpm tests/integration/tpm -m "${OPT_IN}"
