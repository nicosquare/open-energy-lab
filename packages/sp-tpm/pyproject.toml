[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sp-tpm"
version = "0.1.0"
description = "Tractable probabilistic models (SPFlow circuits) embedded in stochastic-programming optimization models."
readme = "README.md"
requires-python = ">=3.11"
# Pyomo, HiGHS and Gurobi are imported lazily; install the matching extra to solve.
dependencies = [
    "numpy",
    "scipy",
    "spflow==1.1.0",
    "torch",
]

[project.optional-dependencies]
pyomo = ["pyomo==6.10.1"]
highs = ["highspy==1.15.1", "pyomo==6.10.1"]
gurobi = ["gurobipy==13.0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/tpm"]
